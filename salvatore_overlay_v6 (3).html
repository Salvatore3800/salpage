<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #00ff00;
    width: 920px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0a0a0f;
    border: 1.5px solid #00d4ff;
    border-radius: 10px;
    overflow: hidden;
    width: 920px;
    height: 160px;
    position: relative;
  }

  .overlay-banner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #00d4ff 40%, #00d4ff 60%, transparent 100%);
    opacity: 0.6;
  }

  .overlay-icon {
    width: 150px;
    height: 160px;
    background: #0d1a1f;
    border-right: 1.5px solid rgba(0,212,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .overlay-icon img {
    width: 118px;
    height: 118px;
    object-fit: contain;
    z-index: 1;
    position: relative;
  }

  .overlay-content {
    padding: 0 4px 0 20px;
  }

  .overlay-brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #00d4ff;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 6px;
  }

  .overlay-tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 52px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    line-height: 1;
    letter-spacing: 1px;
  }

  .overlay-tagline span {
    color: #00d4ff;
  }

  .overlay-divider {
    width: 1.5px;
    height: 80px;
    background: rgba(0,212,255,0.3);
    margin: 0 6px;
    flex-shrink: 0;
  }

  .overlay-cta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-right: 24px;
    flex-shrink: 0;
  }

  .cta-arrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: #00d4ff;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.8;
    animation: bounce 1.5s ease-in-out infinite;
  }

  .cta-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .cta-sub {
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: rgba(0,212,255,0.8);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.8; }
    50% { transform: translateY(-4px); opacity: 1; }
  }

  .pulse-dot {
    width: 14px;
    height: 14px;
    background: #00ff88;
    border-radius: 50%;
    position: absolute;
    top: 18px;
    right: 20px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(0,255,136,0.4); }
    50% { opacity: 0.7; transform: scale(1.1); box-shadow: 0 0 0 8px rgba(0,255,136,0); }
  }

  .scanline {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,212,255,0.015) 3px,
      rgba(0,212,255,0.015) 4px
    );
    pointer-events: none;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="overlay-banner">
    <div class="scanline"></div>
    <div class="pulse-dot"></div>

    <div class="overlay-icon">
      <img src="sal.png" alt="Salvatore380 logo">
    </div>

    <div class="overlay-content">
      <div class="overlay-brand">Salvatore380 — PC Optimization Service</div>
      <div class="overlay-tagline">PC TUNED. <span>MAX FPS.</span></div>
    </div>

    <div class="overlay-divider"></div>

    <div class="overlay-cta">
      <span class="cta-arrow">▲ LINK IN BIO ▲</span>
      <span class="cta-label">TO ORDER</span>
      <span class="cta-sub">Professional PC Optimization</span>
    </div>

  </div>
</body>
</html>
